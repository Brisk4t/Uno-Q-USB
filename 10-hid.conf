# Drop-in for adbd.service: adds an HID function to gadget g1.
# Install as /etc/systemd/system/adbd.service.d/10-hid.conf
#
# Why a drop-in and not an edit of adbd-usb-gadget: that script belongs to the
# `adbd` package (dpkg -S confirms it) and would be overwritten on upgrade.

[Service]
# Appended after the unit's own ExecStartPre (adbd-usb-gadget setup), so the
# gadget and configs/c.1 already exist and the UDC is still unbound.
ExecStartPre=/usr/local/sbin/arduino-hid-gadget setup

# ExecStopPost must be re-ordered, not just appended: the packaged `reset`
# rmdir's configs/c.1 and the gadget root, which fails (EBUSY) while the
# hid.usb0 symlink is still linked in. Clear the inherited list and rebuild it
# with the HID teardown first.
ExecStopPost=
ExecStopPost=/usr/local/sbin/arduino-hid-gadget teardown
ExecStopPost=/usr/lib/android-sdk/platform-tools/adbd-usb-gadget reset
